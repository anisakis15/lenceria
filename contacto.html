<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contacto · Dalia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              menu: ['"Adelon"', "Georgia", "serif"], // menú y títulos
              mono: ['"Geist Mono"', "ui-monospace", "monospace"], // textos
            },
          },
        },
      };
    </script>

    <style>
      /* Si tienes los archivos de Adelon, descomenta y ajusta la ruta
    @font-face { font-family: "Adelon"; src: url("/fonts/Adelon.woff2") format("woff2"); font-display: swap; }
    */
      html {
        background: #fff;
      }

      /* ---------- MENÚ (igual que info.html) ---------- */
      .tight-in {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .tight-img {
        display: block;
        height: min(57vw, 34svh);
        width: auto;
        max-width: 100%;
        object-fit: contain;
      }
      .tight-label {
        margin-top: 1.5svh;
        font-size: 3.2vw;
        line-height: 1;
        white-space: nowrap;
      }
      .tight-link:focus-visible .tight-label {
        text-decoration: underline;
      }
      @media (min-width: 768px) {
        .tight-img {
          height: min(33vw, 44svh);
        }
        .tight-label {
          font-size: clamp(13px, 1.1vw, 18px);
        }
      }
      /* Ratón: medias recogidas; bajan con hover, foco o si es la página actual */
      @media (hover: hover) and (pointer: fine) {
        .tight-in {
          transform: translateY(-48%);
        }
        .tight-link:hover .tight-in,
        .tight-link:focus-visible .tight-in,
        .tight-link[aria-current="page"] .tight-in {
          transform: translateY(-24%);
        }
      }
      /* Táctil: según el wireframe, solo cae la media de la página actual */
      @media not all and (hover: hover) and (pointer: fine) {
        .tight-in {
          transform: translateY(-48%);
        }
        .tight-link[aria-current="page"] .tight-in {
          animation: drop 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
          animation-delay: var(--d);
        }
      }
      @keyframes drop {
        from {
          transform: translateY(-48%);
        }
        to {
          transform: translateY(-24%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tight-in {
          animation: none !important;
          transition: none;
        }
        .tight-link[aria-current="page"] .tight-in {
          transform: translateY(-24%);
        }
      }
    </style>
  </head>

  <body class="overflow-x-hidden bg-white font-mono text-black">
    <!-- ============ MENÚ FIJO (por encima del contenido) ============ -->
    <header
      id="site-header"
      class="pointer-events-none fixed inset-x-0 top-0 z-20 font-menu"
    >
      <nav aria-label="Menú principal">
        <ul class="grid grid-cols-4">
          <li>
            <a
              href="info.html"
              class="tight-link pointer-events-auto block overflow-hidden outline-none"
            >
              <div class="tight-in" style="--d: 500ms">
                <img
                  class="tight-img"
                  src="https://ik.imagekit.io/anisa15/black.png"
                  alt=""
                  draggable="false"
                />
                <span class="tight-label">Info</span>
              </div>
            </a>
          </li>
          <li>
            <a
              href="medias.html"
              class="tight-link pointer-events-auto block overflow-hidden outline-none"
            >
              <div class="tight-in" style="--d: 650ms">
                <img
                  class="tight-img"
                  src="https://ik.imagekit.io/anisa15/blue_Px9BT2qnz.png"
                  alt=""
                  draggable="false"
                />
                <span class="tight-label">Medias</span>
              </div>
            </a>
          </li>
          <li>
            <a
              href="sujetadores.html"
              class="tight-link pointer-events-auto block overflow-hidden outline-none"
            >
              <div class="tight-in" style="--d: 800ms">
                <img
                  class="tight-img"
                  src="https://ik.imagekit.io/anisa15/two.png"
                  alt=""
                  draggable="false"
                />
                <span class="tight-label">Sujetadores</span>
              </div>
            </a>
          </li>
          <li>
            <a
              href="contacto.html"
              aria-current="page"
              class="tight-link pointer-events-auto block overflow-hidden outline-none"
            >
              <div class="tight-in" style="--d: 950ms">
                <img
                  class="tight-img"
                  src="https://ik.imagekit.io/anisa15/white.png"
                  alt=""
                  draggable="false"
                />
                <span class="tight-label">Contacto</span>
              </div>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- ============ CONTENIDO (centrado entre el menú y el logo; si no cabe, hace scroll) ============ -->
    <main
      class="relative z-0 box-border flex min-h-svh [--u:min(3vw,calc((100svh_-_var(--hh,0px)_-_var(--fh,0px)_-_4vw_-_4svh)*0.0276))] items-center justify-center px-[4vw] pt-[calc(var(--hh,0px)+4vw)] pb-[calc(var(--fh,0px)+4svh)] min-[480px]:pt-[calc(var(--hh,0px)+2vw)] min-[480px]:pb-[calc(var(--fh,0px)+6svh)]"
    >
      <h1 class="sr-only">Contacto</h1>

      <div
        class="flex flex-col items-center gap-[calc(var(--u)*3)] min-[480px]:flex-row min-[480px]:items-end min-[480px]:gap-[2.2vw]"
      >
        <!-- Ilustración de la tienda -->
        <img
          class="h-[calc(var(--u)*14)] w-auto shrink-0 min-[480px]:h-[max(160px,calc((100svh_-_var(--hh,0px)_-_var(--fh,0px))*0.78))] min-[480px]:max-w-[46vw] min-[480px]:min-w-0 min-[480px]:shrink min-[480px]:object-contain min-[480px]:object-bottom"
          src="https://ik.imagekit.io/k7xdtotaj/contacto.svg"
          alt="Ilustración de la fachada de la tienda Dalia"
        />

        <!-- Datos de contacto -->
        <div
          class="flex shrink-0 flex-col items-center gap-[calc(var(--u)*1.7)] text-center min-[480px]:items-start min-[480px]:gap-[2.4vw] min-[480px]:text-left"
        >
          <section aria-labelledby="c-tel">
            <h2 id="c-tel" class="font-menu text-[length:calc(var(--u)*1.93)] leading-none min-[480px]:text-[clamp(16px,2.2vw,44px)]">Teléfono</h2>
            <p class="mt-[calc(var(--u)*0.4)] text-[length:var(--u)] min-[480px]:mt-[0.6vw] leading-[1.3] min-[480px]:text-[clamp(10.5px,1.35vw,22px)]">
              <a href="tel:+34697789384" class="outline-none hover:underline focus-visible:underline">697 789 384</a>
            </p>
          </section>

          <section aria-labelledby="c-mail">
            <h2 id="c-mail" class="font-menu text-[length:calc(var(--u)*1.93)] leading-none min-[480px]:text-[clamp(16px,2.2vw,44px)]">Correo</h2>
            <p class="mt-[calc(var(--u)*0.4)] text-[length:var(--u)] min-[480px]:mt-[0.6vw] leading-[1.3] min-[480px]:text-[clamp(10.5px,1.35vw,22px)]">
              <a href="mailto:merceriadalia@gmail.com" class="outline-none hover:underline focus-visible:underline"
                >merceriadalia@gmail.com</a
              >
            </p>
          </section>

          <section aria-labelledby="c-dir">
            <h2 id="c-dir" class="font-menu text-[length:calc(var(--u)*1.93)] leading-none min-[480px]:text-[clamp(16px,2.2vw,44px)]">Dirección</h2>
            <p class="mt-[calc(var(--u)*0.4)] text-[length:var(--u)] min-[480px]:mt-[0.6vw] leading-[1.3] min-[480px]:text-[clamp(10.5px,1.35vw,22px)]">
              <a
                href="https://www.google.com/maps/search/?api=1&amp;query=Av.+del+Dr.+Garc%C3%ADa+Tapia%2C+206%2C+Moratalaz%2C+28030+Madrid"
                target="_blank"
                rel="noopener noreferrer"
                class="outline-none hover:underline focus-visible:underline"
                >Av. del Dr. García Tapia, 206,<br />Moratalaz, 28030 Madrid</a
              >
            </p>
          </section>
        </div>
      </div>
    </main>

    <!-- ============ LOGO ============
       Móvil: fijo abajo, negro. Escritorio: arriba (estado final del landing),
       blanco con mix-blend-mode: exclusion. -->
       <div
       id="site-logo"
       class="pointer-events-none fixed inset-x-0 bottom-0 z-30 px-3 pb-3 md:bottom-auto md:top-[4svh] md:p-0 md:mix-blend-exclusion"
     >
       <a
         href="index.html"
         aria-label="Dalia, inicio"
         class="pointer-events-auto block md:mx-auto md:w-fit"
       >
         <img
           src="https://ik.imagekit.io/anisa15/DALIA.png"
           alt="Dalia"
           draggable="false"
           class="block h-auto max-h-[22svh] w-full object-contain object-bottom md:max-h-none md:w-[clamp(180px,16vw,340px)] md:brightness-0 md:invert"
         />
       </a>
     </div>

    <script>
      // Mide menú y logo para dejar el contenido justo debajo de las medias
      const root = document.documentElement;
      const header = document.getElementById("site-header");
      const logo = document.getElementById("site-logo");
      const mqDesk = matchMedia("(min-width: 768px)");

      function measure() {
        // la media de la página actual siempre está bajada (76% de la altura)
        root.style.setProperty("--hh", header.offsetHeight * 0.76 + "px");
        root.style.setProperty(
          "--fh",
          mqDesk.matches ? "0px" : logo.offsetHeight + "px",
        );
      }
      measure();
      addEventListener("resize", measure);
      mqDesk.addEventListener("change", measure);
      new ResizeObserver(measure).observe(header);
      new ResizeObserver(measure).observe(logo);
    </script>
  </body>
</html>
